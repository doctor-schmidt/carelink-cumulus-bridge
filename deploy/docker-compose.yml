# Despliegue con la imagen ya publicada: no hace falta clonar el repo ni compilar.
#
#   1) crea un fichero .env al lado de este (ver .env.example)
#   2) docker compose up -d
#   3) curl http://127.0.0.1:3000/health
#
# Actualizar:  docker compose pull && docker compose up -d

services:
  glucosa-bridge:
    image: ghcr.io/carlosjpv/carelink-cumulus-bridge:latest
    container_name: glucosa-bridge
    restart: unless-stopped

    environment:
      # --- obligatorias (van en .env, NO aquí) ---------------------------
      LOGINDATA_JSON: ${LOGINDATA_JSON:?Falta LOGINDATA_JSON en .env}
      API_SECRET: ${API_SECRET:?Falta API_SECRET en .env}

      # --- opcionales ----------------------------------------------------
      MMCONNECT_SERVER: ${MMCONNECT_SERVER:-EU}   # EU o US
      POLL_INTERVAL: ${POLL_INTERVAL:-60}         # segundos; no bajar de 60
      STALE_AFTER: ${STALE_AFTER:-900}            # segundos antes de que /health dé 503
      CARELINK_PATIENT: ${CARELINK_PATIENT:-}     # sólo si sigue a varios pacientes
      DATA_DIR: /data

    volumes:
      # Imprescindible: aquí se guarda el refresh token rotado.
      # Sin persistencia, cada reinicio vuelve a la semilla y acaba fallando.
      - glucosa-data:/data

    # Sólo escucha en localhost. Quien lo expone a internet es el proxy inverso
    # (Caddy/nginx con HTTPS) o Tailscale. Ver SELFHOST.md.
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  glucosa-data:
